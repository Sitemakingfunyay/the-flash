
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. Labs | Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(circle at top, #183b59, #07111e 65%);
  color: #eaf5ff;
  font-family: Arial, sans-serif;
}

.login {
  width: 100%;
  max-width: 420px;
  background: #101f30;
  border: 1px solid #31516b;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 20px 70px #0008;
}

h1 {
  font-size: 25px;
  margin: 0 0 8px;
}

.sub {
  color: #9db4c9;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 16px 0 7px;
  color: #bcd0e2;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #38556e;
  background: #081522;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: 0;
  border-radius: 8px;
  background: #38a9e8;
  color: #061522;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

#error {
  color: #ff8585;
  margin-top: 14px;
  min-height: 20px;
}

.small {
  font-size: 12px;
  color: #8199ad;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="login">
  <h1>S.T.A.R. LABS</h1>
  <div class="sub">
    CENTRAL CITY CRIME WATCH — SECURE LOGIN
  </div>

  <form id="loginForm">

    <label for="username">Username</label>
    <input
      id="username"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button type="submit">SIGN IN</button>

    <div id="error"></div>

  </form>

  <div class="small">
    AUTHORIZED PERSONNEL ONLY · DEMO LOGIN
  </div>
</div>

<script>
const accounts = {
  Henry: {
    password: "CentralCity10",
    role: "Site Manager"
  },

  Caitlin: {
    password: "Snowflake27",
    role: "Lead Admin"
  },

  Barry: {
    password: "FastestMan99",
    role: "Field Agent"
  }
};

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  const account = accounts[username];

  if (!account || account.password !== password) {
    document.getElementById("error").textContent =
      "Incorrect username or password.";
    return;
  }

  sessionStorage.setItem("starUser", username);
  sessionStorage.setItem("starRole", account.role);
  sessionStorage.setItem("loginApproved", "yes");

  window.location.replace("index.html");
});
</script>

</body>
</html>
