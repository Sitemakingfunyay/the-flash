
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. Labs Login</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #071321;
  color: white;
  font-family: Arial, sans-serif;
}
.login {
  width: min(90%, 390px);
  padding: 30px;
  background: #10243a;
  border: 1px solid #23618a;
  border-radius: 16px;
  text-align: center;
}
h1 { color: #56c9ff; }
p { color: #a9c5dc; }
input, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 8px;
  font-size: 16px;
}
input {
  background: #071321;
  border: 1px solid #31516b;
  color: white;
}
button {
  background: #168bd0;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #0872b4; }
#error { color: #ff7777; min-height: 20px; }
</style>
</head>
<body>
<div class="login">
  <h1>S.T.A.R. LABS</h1>
  <p>CENTRAL CITY SECURITY LOGIN</p>

  <form id="loginForm">
    <input id="username" placeholder="Username" required>
    <input id="password" type="password"
      placeholder="Password" required>
    <button type="submit">ACCESS SYSTEM</button>
  </form>

  <p id="error"></p>
</div>

<script>
const accounts = {
  henry: {
    password: "CentralCity10",
    role: "Site Manager"
  },
  caitlin: {
    password: "Snowflake27",
    role: "Lead Admin"
  },
  barry: {
    password: "FastestMan99",
    role: "Field Agent"
  }
};

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("username")
    .value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const account = accounts[username];

  if (!account || account.password !== password) {
    document.getElementById("error").textContent =
      "Incorrect username or password.";
    return;
  }

  sessionStorage.setItem("starUser", username);
  sessionStorage.setItem("starRole", account.role);

  window.location.href = "index.html";
});
</script>
</body>
</html>
