<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.R. Labs | Secure Login</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: #eaf5ff;
  background:
    radial-gradient(circle at top, #173b5b, #07111f 65%);
}
.login-box {
  width: 90%;
  max-width: 410px;
  padding: 35px;
  background: rgba(10, 26, 44, 0.96);
  border: 1px solid #2777a8;
  border-radius: 15px;
  box-shadow: 0 0 30px #0879bd55;
}
h1 {
  text-align: center;
  color: #66caff;
  font-size: 25px;
}
.subtitle {
  text-align: center;
  color: #9bbbd3;
  margin-bottom: 30px;
}
label {
  display: block;
  margin: 15px 0 7px;
}
input {
  width: 100%;
  padding: 13px;
  border-radius: 7px;
  border: 1px solid #315a78;
  background: #071522;
  color: white;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 13px;
  margin-top: 22px;
  border: none;
  border-radius: 7px;
  background: #168bd0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #36a9ef;
}
#error {
  color: #ff8585;
  text-align: center;
  margin-top: 15px;
}
.footer {
  text-align: center;
  color: #7898b0;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="login-box">
  <h1>S.T.A.R. LABS</h1>
  <div class="subtitle">CENTRAL CITY CRIME WATCH<br>SECURE LOGIN</div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" autocomplete="username"
      placeholder="Enter username" required>
    <label for="password">Password</label>
    <input id="password" type="password"
      autocomplete="current-password"
      placeholder="Enter password" required>
    <button type="submit">ACCESS DASHBOARD</button>
    <div id="error"></div>
  </form>
  <div class="footer">
    S.T.A.R. LABS • CENTRAL CITY
  </div>
</div>
<script>
const accounts = {
  Henry: {
    password: "CentralCity10",
    role: "Site Manager",
    approved: true
  },
  Caitlin: {
    password: "Snowflake27",
    role: "Lead Admin",
    approved: true
  },
  Barry: {
    password: "FastestMan99",
    role: "Field Agent",
    approved: true
  },
  Cisco: {
    password: "VibeCheck27",
    role: "Barrys Support",
    approved: true
  }
};
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
  event.preventDefault();
  const username =
    document.getElementById("username").value.trim();
  const password =
    document.getElementById("password").value;
  const account = accounts[username];
  const error = document.getElementById("error");
  if (!account || account.password !== password) {
    error.textContent = "Invalid username or password.";
    return;
  }
  if (!account.approved) {
    error.textContent =
      "Account pending approval. Contact the Site Manager.";
    return;
  }
  sessionStorage.setItem("starUser", username);
  sessionStorage.setItem("starRole", account.role);
  sessionStorage.setItem("loginApproved", "yes");
  window.location.replace("index.html");
});
</script>
</body>
</html>
